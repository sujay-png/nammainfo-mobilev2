name: nammainfo_mobile
description: Namma Info — digital business cards, NFC taps, and a business activity feed.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing / deep links
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.6.0

  # NFC (4.x — needed for compatibility with current Kotlin/AGP toolchains;
  # 3.5.0 fails to compile against newer Kotlin compilers)
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  ndef_record: ^1.4.2

  # Deep link fallback handling for links opened outside the app
  app_links: ^6.3.2

  # UI / utility
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0

  # QR scanning
  mobile_scanner: ^6.0.2

  # Local prefs (theme mode, contact tags, notification toggle)
  shared_preferences: ^2.3.3

  # Save a tapped card to the phone's native address book
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
